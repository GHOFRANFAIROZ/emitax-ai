# Tüm ayarlar burada — kodda sabit hiçbir şey yok (esneklik/Scalability temeli)
data:
  raw_glob: "data/raw/*.csv"     # CEMS dosyalarını buraya koyun
  chunksize: null                # çok büyük dosyalar için bir sayı koyun (500000 gibi)
  processed_dir: "data/processed"

columns:
  facility: "Facility Name"
  facility_id: "Facility ID"
  unit: "Unit ID"
  date: "Date"
  hour: "Hour"
  operating_time: "Operating Time"
  fuel_type: "Primary Fuel Type"
  drop_all_nan: true
  context:
    heat_input: "Heat Input (mmBtu)"
    gross_load: "Gross Load (MW)"
  gases:
    CO2: {mass: "CO2 Mass (short tons)", rate: "CO2 Rate (short tons/mmBtu)"}
    SO2: {mass: "SO2 Mass (lbs)",        rate: "SO2 Rate (lbs/mmBtu)"}
    NOx: {mass: "NOx Mass (lbs)",        rate: "NOx Rate (lbs/mmBtu)"}

aggregate:
  period: "M"                    # M = aylık (beyan dönemi)

sanity:
  co2_per_heat_input_center: 0.105   # Limestone verisinden doğrulandı (CV~0.07)
  co2_per_heat_input_tol: 0.03

# --- Aşama 2+3 ---
declaration:
  honest_noise_std: 0.01     # doğal raporlama gürültüsü ±%1 (dürüst beyan ≈ ölçüm)
  seed: 42

tamper:
  fraction: 0.35             # değerlendirme kümesinde manipüle ettiğimiz kayıt oranı
  seed: 7

check:
  rel_tolerance: 0.05        # işaret kaldırmadan önce izin verilen bağıl fark (beyan < ölçüm)

physics:
  rel_tolerance: 0.10        # emisyon katsayısı tabanı kontrolü toleransı
  ratio_low_quantile: 0.05   # gaz oranları için alt sınır (bunun altı = şüpheli)

temporal:
  mad_k: 3.5              # sapma eşiği: intensity < median - k*MAD = şüpheli
  min_months: 3          # birim temel çizgisini kurmak için en az ay sayısı
  drift_slope_frac: 0.03 # kademeli kayma sayılan aylık düşüş eğimi

peer:
  low_quantile: 0.05   # sektör dağılımının bu yüzdeliğinin altındaki yoğunluk = şüpheli
  min_peers: 2         # sektör referansını kurmak için en az birim/tesis sayısı

fusion:
  weights: {measurement: 45, physics: 30, peer: 25, temporal: 20}
  high_threshold: 85     # güven skoru ≥ → otomatik onay
  medium_threshold: 55   # [55,85) → açıklama talebi ; < 55 → insan denetimi

chain:
  schema_version: "emitax-ai/1.0"
  onchain_dir: "data/processed"

physics_ipcc:
  co2_factor_by_fuel: {Coal: 0.1049, Lignite: 0.1077, "Natural Gas": 0.0530}
  default_co2_factor: 0.1049
alarm:
  warn_multiplier: 1.3
  crit_multiplier: 1.6
  legal_limits: {CO2: null, SO2: null, NOx: null}
peer_iforest:
  contamination: 0.10
  random_state: 42
lstm:
  seq_len: 24
  stride: 6
  latent: 32
  hidden: 64
  epochs: 40
  threshold_pct: 99

service:
  host: "127.0.0.1"
  # 8300 — çekirdek servis 8000'de durur. AI ayrı bir süreç olarak çalıştığı
  # için portlar çakışmamalıdır (rapor §5.1). Çekirdek servis buraya
  # EMITAX_AI_URL ile bağlanır.
  port: 8300
  measurement_path: "data/processed/monthly_measurement.csv"
  hourly_path: "data/processed/hourly_clean.parquet"
  onnx_path: "data/processed/lstm_ae.onnx"
  meta_path: "data/processed/lstm_meta.json"